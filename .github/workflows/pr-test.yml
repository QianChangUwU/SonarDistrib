name: PR - Build & Test

on:
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**/*.md'
      - '**/*.txt'
      - '.github/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          submodules: recursive
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Download and setup Dalamud
        run: |
          echo "Downloading Dalamud..."
          wget -q https://goatcorp.github.io/dalamud-distrib/stg/latest.zip -O dalamud.zip
          unzip -q dalamud.zip -d .dalamud
          echo "DALAMUD_HOME=$PWD/.dalamud/" >> $GITHUB_ENV

      - name: Restore
        run: dotnet restore SonarPlugin/SonarPlugin.csproj /p:Configuration=Release --packages .nuget

      - name: Build plugin
        run: |
          dotnet build SonarPlugin/SonarPlugin.csproj \
            -c Release --no-restore \
            -p:DalamudLibPath=$DALAMUD_HOME \
            --source $PWD/.nuget

      - name: Build & run utility tests
        run: |
          dotnet test SonarUtils.Tests/SonarUtils.Tests.csproj \
            -c Release --no-restore \
            --logger "trx;LogFileName=SonarUtils.Tests.trx" \
            --results-directory TestResults

      - name: Verify artifact exists
        run: |
          if [ ! -f "SonarPlugin/bin/SonarPlugin/latest.zip" ]; then
            echo "Error: latest.zip was not produced"
            exit 1
          fi
          echo "latest.zip present: $(ls -la SonarPlugin/bin/SonarPlugin/latest.zip)"

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonar-build
          path: |
            SonarPlugin/bin/SonarPlugin/latest.zip
            SonarPlugin/bin/SonarPlugin/SonarPlugin.json

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/*.trx
